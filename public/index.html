 if(url==='/api/config')return {session:'render'};
 if(url==='/api/scan')return {...browserScan,results:[...browserScan.results]};
 if(url==='/api/stop'){scanGeneration++;scanController?.abort();browserScan.status='stopped';return {ok:true}}
 if(url==='/api/start'){
  const generation=++scanGeneration;scanController?.abort();scanController=new AbortController();const signal=scanController.signal;
  browserScan={status:'running',results:[],total:0,screened:0};
  (async()=>{try{
   const stopped=()=>generation!==scanGeneration||signal.aborted;
   const names=await generateCandidates(data,stopped);if(stopped())return;browserScan.total=names.length;
   let nextRequest=0;
   for(let offset=0;offset<names.length;offset+=10){
    if(stopped())return;const batch=names.slice(offset,offset+10);let retries=0;
    for(;;){
     const delay=Math.max(0,nextRequest-Date.now());if(delay)await new Promise(r=>setTimeout(r,delay));if(stopped())return;
     nextRequest=Date.now()+700;
     const controller=new AbortController(),abort=()=>controller.abort();signal.addEventListener('abort',abort,{once:true});const timeout=setTimeout(abort,45000);let response,payload;
     try{response=await fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({names:batch}),signal:controller.signal});payload=await response.json()}finally{clearTimeout(timeout);signal.removeEventListener('abort',abort)}
     if(stopped())return;
     if(response.status===429&&retries++<8){const seconds=Math.max(1,Math.min(900,Number(payload.retry_after)||60));browserScan.public_wait_until=Date.now()/1000+seconds;nextRequest=Date.now()+seconds*1000;while(Date.now()<nextRequest&&!stopped())await new Promise(r=>setTimeout(r,Math.min(250,nextRequest-Date.now())));continue}
     browserScan.public_wait_until=0;
     if(!response.ok)throw Error(payload.error||'Lookup failed. Retry.');
     if(!Array.isArray(payload.results)||payload.results.some(r=>!batch.includes(r.name)||r.status!=='unclaimed'||!Number.isFinite(Date.parse(r.checked_at))))throw Error('Invalid lookup response.');
     browserScan.results.push(...payload.results);browserScan.screened+=batch.length;break;
    }
   }
   if(!stopped())browserScan.status='done';
  }catch(e){if(generation===scanGeneration&&!signal.aborted){browserScan.status='error';browserScan.error=e.name==='AbortError'?'Lookup timed out. Retry.':e.message}}})();
  return {ok:true};
 }
 throw Error('Unknown request.');
}

HELP.word_mode=['Match','Choose where a dictionary word must appear.','Anywhere: xcat7. Whole name: sh4t. At start: cat7. At end: 7cat.','Whole name requires every character to belong to one matching word.'];HELP.word_min=['Minimum word length','Ignore words shorter than this setting.','4 letters: stone matches; cat7 does not.','Choose 3–7 letters.'];HELP.word_leet=['Leetspeak','Read selected numbers as letters when matching English words.','sh4t → shat; h0ney → honey; 5t0ne → stone.','0→o, 1→i, 3→e, 4→a, 5→s, 7→t, 8→b, 9→g. Original spelling also matches. Select Letters + numbers to generate these names.'];HELP.word_custom=['Extra words','Add words to the bundled dictionary, including slang or names.','nova, zora, slang','Separate words with spaces or commas. Use 3–7 English letters per word. Applies immediately and to your next search.'];HELP.english_only=['English words only','Match words using your Word matching settings.','Enable Leetspeak to match sh4t.','Uses a bundled dictionary plus your extra words. Open Word matching to change position, minimum length and number substitutions.'];
function wordConfig(){return {word_mode:$('word_mode').value||'contains',word_min:Number($('word_min').value)||3,word_leet:$('word_leet').checked,word_custom:$('word_custom').value||''}}
function englishWord(name){const c=wordConfig(),words=new Set([...WORDS,...c.word_custom.toLowerCase().split(/[,\s]+/).filter(w=>/^[a-z]{3,7}$/.test(w))]);name=name.toLowerCase();const versions=[name];if(c.word_leet){const map={'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','8':'b','9':'g'};versions.push([...name].map(x=>map[x]||x).join(''))}for(const text of versions)for(let size=c.word_min;size<=Math.min(7,text.length);size++){if(c.word_mode==='whole'&&size!==text.length)continue;const starts=c.word_mode==='whole'||c.word_mode==='start'?[0]:c.word_mode==='end'?[text.length-size]:Array.from({length:text.length-size+1},(_,i)=>i);if(starts.some(i=>words.has(text.slice(i,i+size))))return true}return false}

function render(list){rawResults=Array.isArray(list)?list.filter(r=>r&&/^[a-z0-9_]{3,7}$/.test(r.name)&&r.status==='unclaimed'&&Number.isFinite(Date.parse(r.checked_at))):[];results=$('english_only').checked?rawResults.filter(r=>englishWord(r.name)):rawResults;const key=JSON.stringify(results)+$('sort').value;if(key===lastKey)return;lastKey=key;const items=[...results];if($('sort').value==='az')items.sort((a,b)=>a.name.localeCompare(b.name));else if($('sort').value==='za')items.sort((a,b)=>b.name.localeCompare(a.name));else items.reverse();const old=new Map([...$('results').children].map(e=>[e.dataset.name,e]));$('results').replaceChildren();$('count').textContent=String(items.length);$('export').disabled=!items.length;$('empty').hidden=!!items.length;if(rawResults.length&&!items.length)$('empty-text').textContent='No English-word names';for(const [index,item] of items.entries()){let b=old.get(item.name);if(!b){b=document.createElement('button');b.className='name';b.dataset.name=item.name;b.style.animationDelay=Math.min(index,8)*18+'ms';b.setAttribute('aria-label','Copy '+item.name);b.title='Unclaimed · '+new Date(item.checked_at).toLocaleString();const name=document.createElement('strong');name.textContent=item.name;b.append(name,fa('copy'));b.onclick=async()=>{try{await navigator.clipboard.writeText(item.name);b.lastChild.replaceWith(fa('check'));setTimeout(()=>b.lastChild.replaceWith(fa('copy')),1200)}catch{$('message').textContent='Select the name to copy it.'}}}else b.style.animation='none';$('results').append(b)}}
function message(state){if(state.status==='running'){const wait=state.public_wait_until||0;if(wait>Date.now()/1000)return `Resuming in ${Math.ceil(wait-Date.now()/1000)}s`;return state.total?`${state.screened} / ${state.total} checked`:'Generating…'}if(state.status==='error')return state.error||'Search failed';if(state.status==='stopped')return 'Stopped';if(state.status==='done')return state.total?`${state.screened} checked`:'No matching names';return ''}
function apply(state){lastState=state;render(state.results);busy(state.status==='running');$('message').textContent=message(state);$('progress').hidden=!running;$('progress').max=state.total||1;$('progress').value=state.screened||0;$('empty-text').textContent=rawResults.length&&!results.length?'No English-word names':state.status==='done'?'No names found':state.status==='error'?'Search failed':'No names yet'}
async function poll(){clearTimeout(timer);try{apply(await request('/api/scan'));pollFailures=0;$('connection-error').hidden=true}catch(e){pollFailures++;$('connection-error').hidden=false;$('connection-error').textContent='Reconnecting…';if(pollFailures>=3)$('find').disabled=true}timer=setTimeout(poll,running||pollFailures?600:2500)}
const textFields=['chars','pattern','prefix','suffix','shape','contains','exclude','required','allowed','first','last','banned'];const numberFields=['limit','vowels','digits','underscores'];
$('filters').onsubmit=async e=>{e.preventDefault();if(!session||running)return;const data={};for(const id of textFields)data[id]=$(id).value;for(const id of numberFields)data[id]=Number($(id).value);data.length=Number($('length').value);data.unique=$('unique').checked;data.no_adjacent=$('no_adjacent').checked;data.english_only=$('english_only').checked;Object.assign(data,wordConfig());busy(true);$('message').textContent='Starting…';try{await request('/api/start',data);await poll()}catch(e){busy(false);$('message').textContent=e.message}};
$('stop').onclick=async()=>{try{await request('/api/stop',{});$('message').textContent='Stopping…';await poll()}catch(e){$('message').textContent=e.message}};
$('reset').onclick=()=>{$('filters').reset();updateLength();updateBatch();$('word-settings').hidden=!$('english_only').checked;render(rawResults);$('message').textContent=''};
$('sort').onchange=()=>render(rawResults);$('english_only').onchange=()=>{ $('word-settings').hidden=!$('english_only').checked;render(rawResults)};for(const id of ['word_mode','word_min','word_leet','word_custom'])$(id).onchange=()=>render(rawResults);$('word_custom').oninput=()=>render(rawResults);
$('export').onclick=()=>{if(!results.length)return;const csv='name,status,checked_at\n'+results.map(r=>`${r.name},unclaimed,${r.checked_at}`).join('\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='four-name.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function topic(key){const entry=HELP[key]||HELP.results;$('help-title').textContent=entry[0];$('help-body').textContent=entry[1];$('help-examples').textContent=entry[2];$('help-notes').textContent=entry[3];for(const b of $('topics').children){b.classList.toggle('selected',b.dataset.topic===key);b.setAttribute('aria-current',b.dataset.topic===key?'true':'false')}}
for(const [key,entry]of Object.entries(HELP)){const b=document.createElement('button');b.textContent=entry[0];b.dataset.topic=key;b.onclick=()=>topic(key);$('topics').append(b)}
for(const b of document.querySelectorAll('[data-help]'))b.onclick=()=>{topic(b.dataset.help);$('wiki').showModal()};$('wiki-close').onclick=()=>$('wiki').close();$('wiki').onclick=e=>{if(e.target===$('wiki')){const r=$('wiki').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('wiki').close()}};
$('advanced').addEventListener('toggle',()=>{if($('advanced').open&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const content=$('advanced').querySelector('.advanced');content.animate([{opacity:0,transform:'translateY(-6px)'},{opacity:1,transform:'translateY(0)'}],{duration:180,easing:'ease-out'})}});
function updateBatch(){$('limit-value').textContent=Number($('limit').value).toLocaleString('en-US');$('limit').style.setProperty('--fill',((Number($('limit').value)-100)/9900*100)+'%');$('limit').setAttribute('aria-valuetext',Number($('limit').value).toLocaleString('en-US')+' candidates')}
$('limit').oninput=updateBatch;updateBatch();
function updateLength(){const n=Number($('length').value);$('length-value').textContent=String(n);$('length').style.setProperty('--fill',((n-3)/4*100)+'%');$('length').setAttribute('aria-valuetext',n+' characters');for(const e of document.querySelectorAll('.length-ticks span'))e.classList.toggle('active',e.textContent===String(n));for(const id of ['pattern','prefix','suffix','contains']){$(id).maxLength=n;$(id).setCustomValidity($(id).value.length>n?'Use at most '+n+' characters.':'')}for(const id of ['vowels','digits','underscores']){for(const option of $(id).options){option.disabled=Number(option.value)>n;option.hidden=Number(option.value)>n}if(Number($(id).value)>n)$(id).value='-1'}const paired=$('shape').querySelector('option[value="aabb"]');paired.disabled=n%2===1;if(paired.disabled&&$('shape').value==='aabb')$('shape').value='any';$('pattern').placeholder='?'.repeat(n)}
$('length').oninput=()=>{updateLength();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)$('length-value').animate([{transform:'scale(.92)'},{transform:'scale(1)'}],{duration:160,easing:'ease-out'})};for(const id of ['pattern','prefix','suffix','contains'])$(id).addEventListener('input',updateLength);updateLength();
async function init(){if(location.protocol==='file:'){$('connection-error').hidden=false;$('connection-error').textContent='Open the deployed Render site.';return}try{session=(await request('/api/config')).session;await poll()}catch{$('connection-error').hidden=false;$('connection-error').textContent='Connection failed. Reload to retry.'}}init();setInterval(()=>{if(lastState?.status==='running')$('message').textContent=message(lastState)},1000);
</script></body></html>
